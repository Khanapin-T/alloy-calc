<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сплав</title>
<meta name="description" content="Калькулятор сплава для ювелирной мастерской">
<meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Сплав">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f3ee;
    --surface: #ffffff;
    --surface-2: #ece8df;
    --text: #1d1b16;
    --muted: #6b665a;
    --border: #d6d0c2;
    --accent: #9a6a12;
    --accent-text: #ffffff;
    --ok: #2f7d43;
    --warn: #8a5200;
    --warn-bg: #fff2d6;
    --danger: #b3261e;
    --radius: 12px;
    --tap: 48px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14130f;
      --surface: #1f1d18;
      --surface-2: #2b2821;
      --text: #f1ede4;
      --muted: #a39d8f;
      --border: #3b372e;
      --accent: #e2b24c;
      --accent-text: #1a1408;
      --ok: #73d08a;
      --warn: #f2bb5c;
      --warn-bg: #33270f;
      --danger: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(64px + env(safe-area-inset-bottom));
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }

  .top {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 4px;
    padding: env(safe-area-inset-top) 4px 0 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .top h1 { flex: 1; min-width: 0; margin: 0; font-size: 18px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn {
    width: var(--tap); height: var(--tap);
    display: grid; place-items: center;
    background: none; border: 0; border-radius: 50%;
  }
  .icon-btn:active { background: var(--surface-2); }
  .btn-clear {
    height: var(--tap); padding: 0 8px;
    background: none; border: 0; border-radius: 10px;
    color: var(--accent); font-size: 16px; font-weight: 600;
  }
  .btn-clear:active { background: var(--surface-2); }
  .icon-btn svg { width: 24px; height: 24px; }

  main { max-width: 760px; margin: 0 auto; padding: 8px 16px 16px; }
  .block { margin-bottom: 12px; }
  .block-head { display: flex; align-items: center; justify-content: space-between; min-height: var(--tap); }
  h2 { margin: 0; font-size: 15px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .block > h2 { margin: 8px 0 6px; }
  .block-hint { margin: 0 0 2px; font-size: 14px; color: var(--muted); }

  .line { display: flex; gap: 6px; align-items: center; }
  .grow { flex: 1 1 0; min-width: 0; }

  input.num {
    width: 100%; height: var(--tap);
    padding: 0 10px;
    font-size: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
  }
  input.num:focus { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
  input.num::placeholder { color: var(--muted); opacity: .8; font-size: 15px; }
  .unit-wrap { position: relative; }
  .unit-wrap input { padding-right: 26px; }
  .unit-wrap .unit { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

  .chip {
    flex: 0 0 auto;
    min-width: 52px; height: var(--tap);
    padding: 0 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 17px; font-weight: 600;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }

  .hint { margin: 4px 0 0; font-size: 13px; color: var(--danger); min-height: 0; }
  .hint:empty { display: none; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; margin: 2px 0 0; }

  .btn-add {
    height: var(--tap); padding: 0 14px;
    background: none; border: 1px solid var(--accent); border-radius: 10px;
    color: var(--accent); font-weight: 600;
  }
  .btn {
    height: var(--tap); padding: 0 16px;
    background: var(--surface-2); border: 0; border-radius: 10px; font-weight: 600;
  }

  /* stock / mix row: [grams] г золота  [585|750|999|___] пробы ...  [toggle] [delete]
     phone: mass + controls on line 1, fineness on line 2; wide screens: one line */
  .item {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .item .g-mass { order: 1; display: flex; align-items: center; gap: 6px; }
  .item .g-ctl { order: 2; display: flex; align-items: center; margin-left: auto; }
  .item .g-fine { order: 3; flex: 1 0 100%; display: flex; align-items: center; gap: 8px; }
  .item .hint { order: 4; flex: 1 0 100%; margin: 0; }
  .item .grams { flex: 0 0 84px; width: 84px; }
  .item .grams input { padding: 0 8px; }
  .item .lbl { font-size: 14px; color: var(--muted); line-height: 1.15; }
  .item .g-fine .lbl { flex: 1; min-width: 0; }
  @media (min-width: 680px) {
    .item { flex-wrap: nowrap; }
    .item .g-fine { order: 2; flex: 0 1 auto; }
    .item .g-ctl { order: 3; }
    .item .hint { order: 5; }
    .item:has(.hint:not(:empty)) { flex-wrap: wrap; }
  }

  .seg {
    flex: 0 0 auto;
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .seg .chip { min-width: 48px; height: 46px; padding: 0 4px; border: 0; border-right: 1px solid var(--border); border-radius: 0; font-size: 16px; }
  .seg .chip[aria-pressed="true"] { border-right-color: var(--accent); }
  .seg input.num { width: 64px; height: 46px; padding: 0 8px; border: 0; border-radius: 0; font-size: 16px; }
  .seg input.num:focus { box-shadow: inset 0 0 0 2px var(--accent); }

  .del {
    width: var(--tap); height: var(--tap);
    display: grid; place-items: center;
    background: none; border: 0; border-radius: 10px; color: var(--muted);
  }
  .del svg { width: 20px; height: 20px; }
  .del:active { background: var(--surface-2); }

  /* secondary control: small switch with a two-line caption */
  .switch {
    display: inline-flex; align-items: center; gap: 6px;
    height: var(--tap); padding: 0 4px;
    background: none; border: 0;
    font-size: 12px; line-height: 1.1; text-align: left; color: var(--muted);
  }
  .switch .track {
    flex: 0 0 auto; position: relative; width: 34px; height: 20px;
    border-radius: 10px; background: var(--border);
    transition: background .15s;
  }
  .switch .thumb {
    position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff; transition: transform .15s;
    box-shadow: 0 1px 2px rgba(0,0,0,.3);
  }
  .switch[aria-checked="true"] { color: var(--text); }
  .switch[aria-checked="true"] .track { background: var(--accent); }
  .switch[aria-checked="true"] .thumb { transform: translateX(14px); }

  .adj-custom { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .adj-custom .lbl { font-size: 13px; color: var(--muted); line-height: 1.15; text-align: right; }
  .adj-custom input.num { flex: 0 0 76px; width: 76px; }
  .result-line { margin: 4px 0 0; font-size: 15px; color: var(--muted); }
  .result-line b { color: var(--text); }
  .results-title { margin: 12px 0 0; font-size: 15px; font-weight: 700; color: var(--text); text-transform: none; letter-spacing: 0; }

  .section-title { margin: 10px 0 6px; font-size: 15px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .info { margin: 4px 0; font-size: 15px; color: var(--muted); }

  .card {
    display: flex; gap: 8px; align-items: flex-start;
    padding: 10px 8px 10px 14px;
    margin-bottom: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .card-main { flex: 1; min-width: 0; }
  .recipe { margin: 0; font-size: 18px; line-height: 1.4; }

  /* recipe as rows: [grams] [fineness badge] [tag] */
  .parts {
    display: grid; grid-template-columns: auto 1fr;
    gap: 4px 10px; align-items: center;
    margin: 0; padding: 0; list-style: none;
  }
  .part { display: contents; }
  .part .mat { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .part .g { justify-self: end; font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .part .g small { font-size: 15px; font-weight: 600; margin-left: 2px; }
  .badge {
    justify-self: start;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 16px; font-weight: 700;
    background: color-mix(in srgb, var(--accent) 22%, var(--surface));
    color: var(--text);
  }
  .badge.lig { background: var(--surface-2); color: var(--muted); font-weight: 600; }
  .part .tag { font-size: 13px; color: var(--muted); }
  .part.whole .g { font-size: 16px; font-weight: 600; color: var(--muted); }
  .part.whole .badge { font-size: 14px; background: var(--surface-2); color: var(--muted); }
  .skip { margin: 6px 0 0; font-size: 14px; color: var(--warn); font-weight: 600; }
  .check { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
  .check.bad { color: var(--warn); font-weight: 600; }
  .note { margin: 6px 0 0; font-size: 14px; color: var(--danger); font-weight: 600; }
  .card.dim .parts, .card.dim .check { opacity: .5; }
  .card.warn { background: var(--warn-bg); border-color: transparent; }
  .card.warn .recipe { font-size: 16px; color: var(--warn); }
  .card.good .recipe { color: var(--ok); font-size: 16px; }
  .copy {
    flex: 0 0 var(--tap); width: var(--tap); height: var(--tap);
    display: grid; place-items: center;
    background: var(--surface-2); border: 0; border-radius: 10px;
  }
  .copy svg { width: 22px; height: 22px; }
  .copy.done { background: var(--ok); color: var(--surface); }
  .empty-note { margin: 0 0 8px; font-size: 14px; color: var(--muted); }

  .mix-total { display: grid; gap: 4px; }
  .mix-total .big { font-size: 28px; font-weight: 700; }
  .mix-total .row { display: flex; justify-content: space-between; font-size: 17px; }

  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex;
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  .tabs button {
    flex: 1; height: 56px;
    background: none; border: 0;
    padding: 0 4px;
    font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap;
    border-top: 3px solid transparent;
  }
  .tabs button[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); }

  dialog {
    width: min(560px, 100vw); max-width: 100vw;
    max-height: 85vh;
    margin: auto auto 0;
    padding: 0;
    background: var(--surface); color: var(--text);
    border: 0; border-radius: 16px 16px 0 0;
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dlg-head { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; border-bottom: 1px solid var(--border); }
  .dlg-head h2 { flex: 1; text-transform: none; letter-spacing: 0; font-size: 18px; color: var(--text); }
  .dlg-body { padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); overflow-y: auto; max-height: calc(85vh - 66px); }
  .hist-item {
    display: block; width: 100%; min-height: var(--tap);
    padding: 10px 12px; margin-bottom: 8px;
    text-align: left;
    background: var(--surface-2); border: 0; border-radius: 10px;
  }
  .hist-item .t { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  label.setting { display: block; margin-bottom: 8px; font-size: 15px; }
  label.setting input { margin-top: 6px; }
</style>
</head>
<body>

<header class="top">
  <h1 id="title">Расчёт</h1>
  <button id="btnClear" class="btn-clear" type="button">Очистить</button>
  <button id="btnHistory" class="icon-btn" type="button" aria-label="История">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>
  </button>
  <button id="btnSettings" class="icon-btn" type="button" aria-label="Настройки">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<main>
  <section id="screenCalc">
    <div class="block">
      <h2>Сколько залить</h2>
      <div class="line">
        <div class="unit-wrap grow">
          <input id="mass" class="num" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="Масса" aria-label="Масса, г">
          <span class="unit">г</span>
        </div>
        <div class="line" id="targetChips">
          <button type="button" class="chip" data-chip="585" aria-pressed="false">585</button>
          <button type="button" class="chip" data-chip="750" aria-pressed="false">750</button>
        </div>
      </div>
    </div>

    <div class="block">
      <div class="block-head">
        <h2>В наличии</h2>
        <button id="addLot" class="btn-add" type="button">+ Добавить</button>
      </div>
      <p class="block-hint">Впиши всё золото этого цвета, которое можно использовать. <span id="ligNote"></span></p>
      <div id="lots"></div>
    </div>

    <div id="results" aria-live="polite"></div>
  </section>

  <section id="screenAdj" hidden>
    <div class="block">
      <div class="block-head">
        <h2>Что есть</h2>
        <button id="addAdj" class="btn-add" type="button">+ Добавить</button>
      </div>
      <p class="block-hint">Металл, пробу которого надо довести. Можно несколько кусков разной пробы.</p>
      <div id="adjRows"></div>
    </div>
    <div class="block">
      <h2>Какая проба нужна</h2>
      <div class="line">
        <div class="line" id="adjTargetChips">
          <button type="button" class="chip" data-chip="585" aria-pressed="false">585</button>
          <button type="button" class="chip" data-chip="750" aria-pressed="false">750</button>
        </div>
        <label class="adj-custom grow">
          <span class="lbl">Своя проба добавки</span>
          <input id="adjCustom" class="num" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="958" aria-label="Своя проба добавки">
        </label>
      </div>
      <p class="hint" id="adjCustomHint"></p>
    </div>
    <div id="adjResult" aria-live="polite"></div>
  </section>

  <section id="screenMix" hidden>
    <div class="block">
      <div class="block-head">
        <h2>Металл</h2>
        <button id="addMix" class="btn-add" type="button">+ Добавить</button>
      </div>
      <div id="mixRows"></div>
      <div class="unit-wrap">
        <input id="mixLig" class="num" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="Лигатура" aria-label="Лигатура, г">
        <span class="unit">г</span>
      </div>
    </div>
    <div id="mixResult" aria-live="polite"></div>
  </section>
</main>

<nav class="tabs">
  <button type="button" data-tab="calc" aria-current="page">Расчёт</button>
  <button type="button" data-tab="adj">Довести пробу</button>
  <button type="button" data-tab="mix">Что получится</button>
</nav>

<dialog id="dlgHistory">
  <div class="dlg-head">
    <h2>История</h2>
    <button id="clearHistory" class="btn" type="button">Очистить</button>
    <button class="icon-btn" type="button" data-close aria-label="Закрыть">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="dlg-body" id="historyList"></div>
</dialog>

<dialog id="dlgSettings">
  <div class="dlg-head">
    <h2>Настройки</h2>
    <button class="icon-btn" type="button" data-close aria-label="Закрыть">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="dlg-body">
    <label class="setting">Проба лигатуры
      <input id="ligFineness" class="num" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
    </label>
    <p class="muted small">История и введённые данные хранятся только на этом устройстве.</p>
  </div>
</dialog>

<script src="solver.js"></script>
<script>
(function () {
  'use strict';
  const S = window.AlloySolver;
  const LOT_CHIPS = [585, 750, 999];
  const TARGET_CHIPS = ['585', '750'];
  const KEY_STATE = 'alloyCalc.state.v1';
  const KEY_HISTORY = 'alloyCalc.history.v1';
  const HISTORY_DELAY_MS = 3000;

  const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';
  const ICON_DONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';
  const ICON_DEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';

  // ---------- storage (device-local, never throws) ----------
  const store = {
    get(key, fallback) {
      try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage unavailable */ }
    },
  };

  // ---------- state ----------
  let nextId = 1;
  const newLot = (src) => ({
    id: nextId++,
    gramsStr: (src && src.gramsStr) || '',
    fineStr: (src && src.fineStr) || '',
    mandatory: !!(src && src.mandatory),
    touched: !!(src && src.touched),
  });
  const newMixRow = (src) => ({ id: nextId++, gramsStr: (src && src.gramsStr) || '', fineStr: (src && src.fineStr) || '' });

  function loadState() {
    const s = store.get(KEY_STATE, null) || {};
    const mix = s.mix || {};
    const adj = s.adj || {};
    return {
      tab: ['calc', 'adj', 'mix'].includes(s.tab) ? s.tab : 'calc',
      massStr: typeof s.massStr === 'string' ? s.massStr : '',
      targetStr: TARGET_CHIPS.includes(s.targetStr) ? s.targetStr : TARGET_CHIPS[0],
      ligStr: typeof s.ligStr === 'string' ? s.ligStr : '0',
      lots: Array.isArray(s.lots) && s.lots.length ? s.lots.map(newLot) : [newLot()],
      mix: {
        rows: Array.isArray(mix.rows) && mix.rows.length ? mix.rows.map(newMixRow) : [newMixRow(), newMixRow()],
        ligStr: typeof mix.ligStr === 'string' ? mix.ligStr : '',
      },
      adj: {
        rows: Array.isArray(adj.rows) && adj.rows.length ? adj.rows.map(newMixRow) : [newMixRow()],
        targetStr: TARGET_CHIPS.includes(adj.targetStr) ? adj.targetStr : TARGET_CHIPS[0],
        customStr: typeof adj.customStr === 'string' ? adj.customStr : '',
      },
    };
  }

  let state = loadState();
  let history = store.get(KEY_HISTORY, []);
  if (!Array.isArray(history)) history = [];
  const saveState = () => store.set(KEY_STATE, state);

  // ---------- helpers ----------
  const $ = (id) => document.getElementById(id);
  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') node.className = v;
      else if (k === 'text') node.textContent = v;
      else if (k === 'html') node.innerHTML = v;
      else node.setAttribute(k, v === true ? '' : v);
    }
    for (const c of [].concat(children || [])) if (c) node.append(c);
    return node;
  }
  const ligatureFineness = () => S.parseLigatureFineness(state.ligStr);
  const chipValue = (fineStr) => {
    const v = S.parseNumber(fineStr);
    return LOT_CHIPS.includes(v) ? v : null;
  };
  // manual fineness (not a chip value) means "whole lot goes in" by default
  const autoMandatory = (fineStr) => {
    const f = S.parseFineness(fineStr).value;
    return f !== null && !LOT_CHIPS.includes(f);
  };

  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
    } catch (e) { /* fall through */ }
    const ta = el('textarea', { readonly: true, style: 'position:fixed;top:0;opacity:0' });
    ta.value = text;
    document.body.append(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }

  function copyButton(getText, onCopy) {
    const btn = el('button', { type: 'button', class: 'copy', 'aria-label': 'Копировать', html: ICON_COPY });
    btn.addEventListener('click', async () => {
      const ok = await copyText(getText());
      if (onCopy) onCopy();
      if (!ok) return;
      btn.classList.add('done');
      btn.innerHTML = ICON_DONE;
      setTimeout(() => { btn.classList.remove('done'); btn.innerHTML = ICON_COPY; }, 1200);
    });
    return btn;
  }

  // ---------- stock / mix rows ----------
  // withSwitch: stock row (toggle + "пробы в наличии"); otherwise a screen-2 row
  function rowEl(item, withSwitch) {
    const grams = el('div', { class: 'grams' },
      el('input', { class: 'num', type: 'text', inputmode: 'decimal', autocomplete: 'off', enterkeyhint: 'done',
        placeholder: '0', 'aria-label': 'Граммы золота', 'data-k': 'grams', value: item.gramsStr }));
    const chips = LOT_CHIPS.map((v) => el('button', { type: 'button', class: 'chip', 'data-chip': v, 'aria-pressed': 'false', text: String(v) }));
    const custom = el('input', { class: 'num', type: 'text', inputmode: 'decimal', autocomplete: 'off',
      enterkeyhint: 'done', placeholder: 'своя', 'aria-label': 'Своя проба', 'data-k': 'fine',
      value: chipValue(item.fineStr) === null ? item.fineStr : '' });
    const ctl = [];
    if (withSwitch) {
      ctl.push(el('button', { type: 'button', class: 'switch', role: 'switch', 'aria-checked': 'false', 'aria-label': 'Весь в плавку' }, [
        el('span', { class: 'track' }, el('span', { class: 'thumb' })),
        el('span', { html: 'Весь в<br>плавку' }),
      ]));
    }
    ctl.push(el('button', { type: 'button', class: 'del', 'aria-label': 'Удалить строку', html: ICON_DEL }));
    const row = el('div', { class: 'item', 'data-id': item.id }, [
      el('div', { class: 'g-mass' }, [grams, el('span', { class: 'lbl', text: 'г золота' })]),
      el('div', { class: 'g-fine' }, [
        el('div', { class: 'seg' }, chips.concat(custom)),
        el('span', { class: 'lbl', text: withSwitch ? 'пробы в наличии' : 'пробы' }),
      ]),
      el('div', { class: 'g-ctl' }, ctl),
      el('p', { class: 'hint' }),
    ]);
    updateRow(row, item);
    return row;
  }

  function updateRow(row, item) {
    const v = S.parseNumber(item.fineStr);
    row.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(Number(c.dataset.chip) === v)));
    const sw = row.querySelector('.switch');
    if (sw) sw.setAttribute('aria-checked', String(!!item.mandatory));
    row.querySelector('.hint').textContent = S.parseFineness(item.fineStr).error || '';
  }

  // shared input/click handling for both lists
  function bindList(container, getList, setList, makeItem, withSwitch, onChange) {
    const find = (node) => {
      const row = node.closest('.item');
      return row ? { row, item: getList().find((x) => x.id === Number(row.dataset.id)) } : {};
    };
    container.addEventListener('input', (e) => {
      const { row, item } = find(e.target);
      if (!item) return;
      if (e.target.dataset.k === 'grams') item.gramsStr = e.target.value;
      if (e.target.dataset.k === 'fine') {
        item.fineStr = e.target.value;
        if (withSwitch && !item.touched) item.mandatory = autoMandatory(item.fineStr);
      }
      updateRow(row, item);
      onChange();
    });
    container.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const { row, item } = find(btn);
      if (!item) return;
      if (btn.dataset.chip) {
        item.fineStr = btn.dataset.chip;
        row.querySelector('[data-k="fine"]').value = '';
        if (withSwitch && !item.touched) item.mandatory = false;
      } else if (btn.classList.contains('switch')) {
        item.mandatory = !item.mandatory;
        item.touched = true;
      } else if (btn.classList.contains('del')) {
        const rest = getList().filter((x) => x !== item);
        if (rest.length) {
          setList(rest);
          row.remove();
        } else {
          const fresh = makeItem();
          setList([fresh]);
          row.replaceWith(rowEl(fresh, withSwitch));
        }
        onChange();
        return;
      } else return;
      updateRow(row, item);
      onChange();
    });
  }

  function renderLots() {
    $('lots').replaceChildren(...state.lots.map((l) => rowEl(l, true)));
    $('ligNote').textContent = 'Лигатура (проба ' + S.formatFinenessShort(ligatureFineness()) + ') есть всегда.';
  }
  function renderMixRows() {
    $('mixRows').replaceChildren(...state.mix.rows.map((r) => rowEl(r, false)));
  }

  // ---------- target ----------
  function updateTargetUI() {
    const v = S.parseNumber(state.targetStr);
    document.querySelectorAll('#targetChips .chip').forEach((c) => c.setAttribute('aria-pressed', String(Number(c.dataset.chip) === v)));
  }

  // ---------- screen 1 ----------
  function readCalc() {
    return {
      massMg: S.parseGrams(state.massStr),
      target: S.parseFineness(state.targetStr).value,
      ligatureFineness: ligatureFineness(),
      lots: state.lots.map((l) => ({
        id: l.id,
        mg: S.parseGrams(l.gramsStr),
        fineness: S.parseFineness(l.fineStr).value,
        mandatory: l.mandatory,
      })),
    };
  }

  // one row per material; whole lots are the same on every card, so they stay quiet
  function recipeEl(parts) {
    return el('ul', { class: 'parts' }, parts.map((part) => {
      const lig = part.source === 'ligature';
      let tag = '';
      if (part.wholeLot) tag = 'весь лот';
      else if (part.cutFromMg) tag = 'из ' + S.formatGramsShort(part.cutFromMg) + ' г';
      return el('li', { class: 'part' + (part.wholeLot ? ' whole' : '') }, [
        el('span', { class: 'g' }, [S.formatGrams(part.mg), el('small', { text: 'г' })]),
        el('span', { class: 'mat' }, [
          el('span', { class: 'badge' + (lig ? ' lig' : ''), text: lig ? 'лигатура' : S.formatFinenessShort(part.fineness) }),
          tag ? el('span', { class: 'tag', text: tag }) : null,
        ]),
      ]);
    }));
  }

  // the check line is not shown; only warn when rounding to 0.01 g moves the fineness noticeably
  function checkEl(check) {
    if (check.ok) return null;
    return el('p', { class: 'check bad', text: 'Из-за округления до 0.01 г проба выйдет ' + S.formatFineness(check.fineness) });
  }

  function optionCard(o, extraClass) {
    return el('article', { class: 'card' + (extraClass ? ' ' + extraClass : '') + (o.feasible === false ? ' dim' : '') }, [
      el('div', { class: 'card-main' }, [
        recipeEl(o.parts),
        o.note ? el('p', { class: 'note', text: o.note }) : null,
        o.skipped && o.skipped.length
          ? el('p', { class: 'skip', text: 'Не брать: ' + o.skipped.map((l) => S.formatGrams(l.mg) + ' г ' + S.formatFinenessShort(l.fineness)).join(', ') })
          : null,
        checkEl(o.check),
      ]),
      copyButton(() => o.text, commitHistory),
    ]);
  }

  function messageCard(text, cls) {
    return el('article', { class: 'card ' + cls }, el('div', { class: 'card-main' }, el('p', { class: 'recipe', text })));
  }

  function renderResults(res, input) {
    const out = [];
    if (res.status !== 'empty') out.push(el('h2', { class: 'results-title', text: S.resultsTitle(input.massMg, input.target) }));
    if (res.status === 'exact') {
      out.push(messageCard(res.message, 'good'));
      out.push(optionCard(res));
    } else if (res.status === 'error') {
      out.push(messageCard(res.message, 'warn'));
      if (res.dilutions.length) {
        out.push(el('div', { class: 'section-title', text: 'Можно так: обрезать лот и добавить лигатуру' }));
        res.dilutions.forEach((d) => out.push(optionCard(d)));
      }
    } else if (res.status === 'ok') {
      if (res.hasMandatory) {
        out.push(el('p', { class: 'info', text: 'Остаток: ' + S.formatGrams(res.remainder.mg) +
          ' г пробы ' + S.formatFineness(res.remainder.fineness) }));
      }
      if (!res.hasFreeStock) {
        // nothing to pick from (no rows, or only "весь в плавку" rows): one plain list
        out.push(el('div', { class: 'section-title', text: res.hasMandatory ? 'Чем дополнить' : 'Варианты' }));
        res.options.forEach((o) => out.push(optionCard(o)));
      } else {
        const own = res.options.filter((o) => o.section === 'stock' || o.section === 'short');
        const other = res.options.filter((o) => o.section === 'other');
        if (own.length) out.push(el('div', { class: 'section-title', text: 'Из наличия' }));
        else out.push(el('p', { class: 'empty-note', text: 'Свободные строки наличия сюда не подходят по пробе.' }));
        own.forEach((o) => out.push(optionCard(o)));
        if (other.length) {
          out.push(el('div', { class: 'section-title', text: 'Остальные варианты (наличие не указано)' }));
          other.forEach((o) => out.push(optionCard(o)));
        }
      }
      if (!res.options.length) out.push(el('p', { class: 'empty-note', text: 'Вариантов нет.' }));
    }
    $('results').replaceChildren(...out);
  }

  function recalc() {
    const input = readCalc();
    const res = S.solve(input);
    renderResults(res, input);
    saveState();
    scheduleHistory(res);
  }

  // ---------- history ----------
  let historyTimer = null;

  function scheduleHistory(res) {
    clearTimeout(historyTimer);
    historyTimer = res.status === 'empty' ? null : setTimeout(commitHistory, HISTORY_DELAY_MS);
  }

  function commitHistory() {
    clearTimeout(historyTimer);
    historyTimer = null;
    const input = readCalc();
    if (S.solve(input).status === 'empty') return;
    const lots = S.validLots(input.lots);
    const key = JSON.stringify([input.massMg, input.target, input.ligatureFineness,
      lots.map((l) => [l.mg, l.fineness, l.mandatory])]);
    const label = S.formatGrams(input.massMg) + ' г → ' + S.formatFinenessShort(input.target) +
      (lots.length ? ' · ' + lots.map((l) => S.formatGrams(l.mg) + ' г ' + S.formatFinenessShort(l.fineness) +
        (l.mandatory ? ' (весь)' : '')).join(', ') : '');
    history = S.addToHistory(history, {
      key,
      label,
      ts: Date.now(),
      input: {
        massStr: state.massStr,
        targetStr: state.targetStr,
        ligStr: state.ligStr,
        lots: state.lots.map(({ gramsStr, fineStr, mandatory, touched }) => ({ gramsStr, fineStr, mandatory, touched })),
      },
    });
    store.set(KEY_HISTORY, history);
  }

  function renderHistory() {
    const list = $('historyList');
    if (!history.length) {
      list.replaceChildren(el('p', { class: 'muted', text: 'История пуста.' }));
      return;
    }
    const fmt = new Intl.DateTimeFormat('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    list.replaceChildren(...history.map((h) => {
      const b = el('button', { type: 'button', class: 'hist-item' }, [
        el('span', { text: h.label }),
        el('span', { class: 't', text: fmt.format(new Date(h.ts)) }),
      ]);
      b.addEventListener('click', () => restore(h));
      return b;
    }));
  }

  function restore(entry) {
    const inp = entry.input || {};
    state.massStr = inp.massStr || '';
    state.targetStr = TARGET_CHIPS.includes(inp.targetStr) ? inp.targetStr : TARGET_CHIPS[0];
    if (typeof inp.ligStr === 'string') state.ligStr = inp.ligStr;
    state.lots = (inp.lots || []).map(newLot);
    if (!state.lots.length) state.lots.push(newLot());
    state.tab = 'calc';
    $('dlgHistory').close();
    renderAll();
  }

  // ---------- screen 2 ----------
  function recalcMix() {
    const r = S.mixResult({
      rows: state.mix.rows.map((x) => ({ mg: S.parseGrams(x.gramsStr), fineness: S.parseFineness(x.fineStr).value })),
      ligatureMg: S.parseGrams(state.mix.ligStr),
      ligatureFineness: ligatureFineness(),
    });
    saveState();
    if (!r) { $('mixResult').replaceChildren(); return; }
    const total = S.formatGrams(r.totalMg);
    const gold = S.formatGold(r.goldMg);
    const fin = S.formatFineness(r.fineness);
    const text = total + ' г, проба ' + fin + ' (чистое золото ' + gold + ' г)';
    $('mixResult').replaceChildren(
      el('div', { class: 'section-title', text: 'Получится' }),
      el('article', { class: 'card' }, [
        el('div', { class: 'card-main mix-total' }, [
          el('div', { class: 'big', text: 'Проба ' + fin }),
          el('div', { class: 'row' }, [el('span', { class: 'muted', text: 'Общая масса' }), el('b', { text: total + ' г' })]),
          el('div', { class: 'row' }, [el('span', { class: 'muted', text: 'Чистое золото' }), el('b', { text: gold + ' г' })]),
        ]),
        copyButton(() => text),
      ])
    );
  }

  // ---------- screen "Довести пробу" ----------
  function renderAdjRows() {
    $('adjRows').replaceChildren(...state.adj.rows.map((r) => rowEl(r, false)));
  }

  function updateAdjTargetUI() {
    const v = S.parseNumber(state.adj.targetStr);
    document.querySelectorAll('#adjTargetChips .chip').forEach((c) => c.setAttribute('aria-pressed', String(Number(c.dataset.chip) === v)));
  }

  function recalcAdj() {
    const custom = S.parseFineness(state.adj.customStr);
    const target = S.parseNumber(state.adj.targetStr);
    const res = S.adjustFineness({
      rows: state.adj.rows.map((x) => ({ mg: S.parseGrams(x.gramsStr), fineness: S.parseFineness(x.fineStr).value })),
      target,
      customFineness: custom.value,
      ligatureFineness: ligatureFineness(),
    });
    saveState();
    $('adjCustomHint').textContent = custom.error || (res.status === 'ok' && res.customError) || '';
    if (res.status === 'empty') { $('adjResult').replaceChildren(); return; }

    const haveF = S.formatFinenessShort(Math.round(res.haveFineness * 10) / 10);
    const out = [el('h2', { class: 'results-title',
      text: 'Что добавить к ' + S.formatGramsShort(res.haveMg) + ' г пробы ' + haveF + ', чтобы стало ' + S.formatFinenessShort(target) })];
    if (res.status === 'exact') {
      out.push(messageCard(res.message, 'good'));
    } else {
      if (res.direction === 'down') out.push(el('p', { class: 'info', text: 'Проба выше нужной: разбавить.' }));
      out.push(el('div', { class: 'section-title', text: 'Варианты' }));
      res.options.forEach((o) => out.push(el('article', { class: 'card' }, [
        el('div', { class: 'card-main' }, [
          recipeEl(o.parts),
          el('p', { class: 'result-line' }, ['получится ', el('b', { text: S.formatGrams(o.totalMg) + ' г' }),
            ' пробы ' + S.formatFinenessShort(target)]),
          checkEl(o.check),
        ]),
        copyButton(() => o.text),
      ])));
    }
    $('adjResult').replaceChildren(...out);
  }

  // ---------- tabs / dialogs ----------
  function showTab(tab) {
    state.tab = tab;
    $('screenCalc').hidden = tab !== 'calc';
    $('screenAdj').hidden = tab !== 'adj';
    $('screenMix').hidden = tab !== 'mix';
    $('title').textContent = { calc: 'Расчёт', adj: 'Довести пробу', mix: 'Что получится' }[tab];
    document.querySelectorAll('.tabs button').forEach((b) => {
      if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    saveState();
  }

  function renderAll() {
    $('mass').value = state.massStr;
    $('ligFineness').value = state.ligStr;
    $('mixLig').value = state.mix.ligStr;
    $('adjCustom').value = state.adj.customStr;
    updateTargetUI();
    updateAdjTargetUI();
    renderLots();
    renderMixRows();
    renderAdjRows();
    showTab(state.tab);
    recalc();
    recalcMix();
    recalcAdj();
  }

  // ---------- wiring ----------
  $('mass').addEventListener('input', (e) => { state.massStr = e.target.value; recalc(); });
  $('targetChips').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    state.targetStr = chip.dataset.chip;
    updateTargetUI();
    recalc();
  });

  bindList($('lots'), () => state.lots, (v) => { state.lots = v; }, newLot, true, recalc);
  bindList($('mixRows'), () => state.mix.rows, (v) => { state.mix.rows = v; }, newMixRow, false, recalcMix);
  bindList($('adjRows'), () => state.adj.rows, (v) => { state.adj.rows = v; }, newMixRow, false, recalcAdj);
  $('addAdj').addEventListener('click', () => {
    state.adj.rows.push(newMixRow());
    renderAdjRows();
    $('adjRows').lastElementChild.querySelector('[data-k="grams"]').focus();
  });
  $('adjTargetChips').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    state.adj.targetStr = chip.dataset.chip;
    updateAdjTargetUI();
    recalcAdj();
  });
  $('adjCustom').addEventListener('input', (e) => { state.adj.customStr = e.target.value; recalcAdj(); });

  $('addLot').addEventListener('click', () => {
    state.lots.push(newLot());
    renderLots();
    recalc();
    $('lots').lastElementChild.querySelector('[data-k="grams"]').focus();
  });
  $('addMix').addEventListener('click', () => {
    state.mix.rows.push(newMixRow());
    renderMixRows();
    $('mixRows').lastElementChild.querySelector('[data-k="grams"]').focus();
  });
  $('mixLig').addEventListener('input', (e) => { state.mix.ligStr = e.target.value; recalcMix(); });

  document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => showTab(b.dataset.tab)));

  // next flask: the current calculation goes to history, inputs are reset (target stays)
  $('btnClear').addEventListener('click', () => {
    if (state.tab === 'calc') {
      commitHistory();
      state.massStr = '';
      state.lots = [newLot()];
    } else if (state.tab === 'adj') {
      state.adj = { rows: [newMixRow()], targetStr: state.adj.targetStr, customStr: '' };
    } else {
      state.mix = { rows: [newMixRow(), newMixRow()], ligStr: '' };
    }
    renderAll();
    if (state.tab === 'calc') $('mass').focus();
  });
  $('btnHistory').addEventListener('click', () => { renderHistory(); $('dlgHistory').showModal(); });
  $('btnSettings').addEventListener('click', () => $('dlgSettings').showModal());
  document.querySelectorAll('dialog').forEach((d) => {
    d.addEventListener('click', (e) => { if (e.target === d || e.target.closest('[data-close]')) d.close(); });
  });
  $('clearHistory').addEventListener('click', () => {
    if (!history.length || !confirm('Очистить историю?')) return;
    history = [];
    store.set(KEY_HISTORY, history);
    renderHistory();
  });
  $('ligFineness').addEventListener('input', (e) => {
    state.ligStr = e.target.value;
    $('ligNote').textContent = 'Лигатура (проба ' + S.formatFinenessShort(ligatureFineness()) + ') есть всегда.';
    recalc();
    recalcMix();
    recalcAdj();
  });

  // don't lose a pending history entry when the app goes to background
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && historyTimer) commitHistory();
  });

  renderAll();
})();
</script>
</body>
</html>
